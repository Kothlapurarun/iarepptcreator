<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Night</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#0a0e1a;--bg-card:#111827;--bg-surface:#1a2035;--bg-elevated:#232d45;
  --border:#2a3555;--border-glow:rgba(56,189,248,0.25);
  --text:#e2e8f0;--text-dim:#94a3b8;--text-muted:#64748b;
  --accent:#38bdf8;--accent-dim:rgba(56,189,248,0.15);
  --gold:#fbbf24;--gold-dim:rgba(251,191,36,0.15);
  --green:#34d399;--green-dim:rgba(52,211,153,0.15);
  --red:#f87171;--red-dim:rgba(248,113,113,0.15);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.15);
  --table-felt:#0c3a2a;--table-rim:#1a5c44;
  --card-w:60px;--card-h:84px;--card-radius:6px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:0 4px 12px rgba(0,0,0,0.5);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.6);
  --shadow-glow:0 0 20px rgba(56,189,248,0.15);
  --transition:0.2s ease;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--text);background:var(--bg-deep)}
body{position:relative}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--accent),0 0 10px rgba(56,189,248,0.3)}50%{box-shadow:0 0 15px var(--accent),0 0 30px rgba(56,189,248,0.4)}}
@keyframes winGlow{0%,100%{box-shadow:0 0 10px var(--gold),0 0 20px rgba(251,191,36,0.4)}50%{box-shadow:0 0 25px var(--gold),0 0 50px rgba(251,191,36,0.5)}}
@keyframes dealCard{from{opacity:0;transform:translateY(-40px) rotateY(90deg)}to{opacity:1;transform:translateY(0) rotateY(0)}}
@keyframes chipBounce{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(600px) rotate(720deg);opacity:0}}
@keyframes floatSuit{0%{transform:translateY(0) rotate(0deg);opacity:0.08}50%{opacity:0.12}100%{transform:translateY(-100vh) rotate(360deg);opacity:0.04}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes borderPulse{0%,100%{border-color:var(--border)}50%{border-color:var(--accent)}}
@keyframes starFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ===================== SCREENS ===================== */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.screen.active{display:flex}
.screen-bg{position:absolute;inset:0;background:var(--bg-deep)}
.screen-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(56,189,248,0.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 70%,rgba(167,139,250,0.04) 0%,transparent 50%)}
.screen-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2rem;animation:fadeIn 0.5s ease}

/* FLOATING SUITS BACKGROUND */
.floating-suits{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.float-suit{position:absolute;bottom:-40px;font-size:2rem;opacity:0;animation:floatSuit linear infinite;pointer-events:none}

/* ===================== SPLASH ===================== */
#splash .logo-wrap{display:flex;flex-direction:column;align-items:center;gap:0.75rem}
#splash .logo-chip{width:100px;height:100px;animation:spin 8s linear infinite}
#splash .logo-text{font-size:3rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent),var(--purple),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#splash .tagline{color:var(--text-dim);font-size:0.9rem;letter-spacing:6px;text-transform:uppercase}
#splash .loading-bar{width:200px;height:3px;background:var(--bg-elevated);border-radius:2px;overflow:hidden}
#splash .loading-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--purple),var(--gold));border-radius:2px;transition:width 0.3s ease}

/* ===================== MAIN MENU ===================== */
#main-menu .menu-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:min(420px,90vw);display:flex;flex-direction:column;gap:1rem;box-shadow:var(--shadow-lg);animation:scaleIn 0.4s ease;position:relative;overflow:hidden}
#main-menu .menu-panel::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:60%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),var(--accent),transparent)}
.menu-header{text-align:center;margin-bottom:0.5rem}
.menu-header .menu-chip{width:64px;height:64px;margin:0 auto 0.75rem}
.menu-header h1{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.menu-header .subtitle{color:var(--text-dim);font-size:0.8rem;margin-top:0.25rem}
.menu-btn{display:flex;align-items:center;gap:0.75rem;padding:0.85rem 1.2rem;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);color:var(--text);font-size:0.95rem;cursor:pointer;transition:all var(--transition)}
.menu-btn:hover{background:var(--bg-elevated);border-color:var(--accent);box-shadow:var(--shadow-glow);transform:translateY(-1px)}
.menu-btn .icon{width:24px;height:24px;flex-shrink:0}
.menu-row{display:flex;gap:0.75rem}
.menu-row .menu-btn{flex:1}
.menu-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.menu-section-label{font-size:0.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding:0 0.25rem}
.menu-settings{display:flex;align-items:center;gap:0.5rem;padding:0.6rem 1rem;font-size:0.8rem;color:var(--text-dim)}
.menu-settings select{background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:0.3rem 0.5rem;font-size:0.8rem;cursor:pointer}
.menu-settings select:focus{outline:none;border-color:var(--accent)}

/* ===================== GAME SCREEN ===================== */
#game-screen{justify-content:space-between;padding:0}
#game-screen .screen-bg{background:var(--bg-deep)}

/* TOP BAR */
.top-bar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0.5rem 1rem;background:rgba(10,14,26,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-bar .hud{display:flex;gap:1.2rem;font-size:0.75rem;color:var(--text-dim)}
.top-bar .hud span{display:flex;align-items:center;gap:0.35rem}
.top-bar .hud .val{color:var(--text);font-weight:600}
.top-bar .hud .stage-badge{background:var(--accent-dim);color:var(--accent);padding:0.15rem 0.5rem;border-radius:4px;font-weight:600}
.btn-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);color:var(--text-dim);cursor:pointer;transition:all var(--transition)}
.btn-icon:hover{background:var(--bg-elevated);color:var(--text);border-color:var(--accent)}
.btn-icon svg{width:16px;height:16px;fill:currentColor}

/* TABLE */
.table-area{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.table-surface{position:relative;width:min(680px,85vw);height:min(340px,50vw);border-radius:50%;border:8px solid var(--table-rim);box-shadow:inset 0 2px 30px rgba(0,0,0,0.4),0 0 60px rgba(10,58,42,0.3),var(--shadow-lg);overflow:hidden}
.table-felt{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#0f4a32,var(--table-felt))}
.table-felt::before{content:'';position:absolute;inset:0;border-radius:50%;background:url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0z' fill='none'/%3E%3Cpath d='M20 0L40 20L20 40L0 20z' fill='none' stroke='rgba(255,255,255,0.03)' stroke-width='0.5'/%3E%3C/svg%3E");opacity:0.5}
.table-felt::after{content:'';position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.06);pointer-events:none}
.table-rim-inner{position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(255,255,255,0.04);pointer-events:none;z-index:1}

/* POT DISPLAY */
.pot-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5}
.pot-chip{width:32px;height:32px;margin:0 auto 4px}
.pot-label{font-size:0.6rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:2px}
.pot-amount{font-size:1.4rem;font-weight:700;color:var(--gold);text-shadow:0 0 10px rgba(251,191,36,0.4)}

/* COMMUNITY CARDS */
.community-area{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);display:flex;gap:6px;z-index:5}

/* ===================== CARDS ===================== */
.card{width:var(--card-w);height:var(--card-h);border-radius:var(--card-radius);position:relative;perspective:600px;flex-shrink:0}
.card-inner{width:100%;height:100%;position:relative;transition:transform 0.5s ease;transform-style:preserve-3d}
.card-inner.face-down .card-front{transform:rotateY(180deg)}
.card-inner.face-down .card-back{transform:rotateY(0deg)}
.card-front,.card-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--card-radius)}
.card-front{background:#fff;display:flex;flex-direction:column;padding:3px 4px;justify-content:space-between;box-shadow:var(--shadow-md)}
.card-back{border:1px solid #2a4a6f;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow-md)}
.card-back svg{width:100%;height:100%;border-radius:var(--card-radius)}
.card-front .card-tl,.card-front .card-br{display:flex;flex-direction:column;align-items:center;line-height:1}
.card-front .card-br{transform:rotate(180deg)}
.card-front .card-rank{font-size:0.75rem;font-weight:700;line-height:1}
.card-front .card-suit{font-size:0.6rem;line-height:1}
.card-suit.red{color:#dc2626}
.card-suit.black{color:#1a1a1a}
.card-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.card.deal-anim{animation:dealCard 0.4s ease backwards}
.card.highlight{animation:winGlow 1s ease infinite}
.card.small{--card-w:44px;--card-h:62px}
.card.small .card-rank{font-size:0.6rem}
.card.small .card-suit{font-size:0.45rem}
.card.small .card-center{font-size:1rem}

/* ===================== SEATS ===================== */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:0.3rem;transition:all 0.3s ease;z-index:10}
.seat.empty{opacity:0;pointer-events:none}
.seat-info{display:flex;flex-direction:column;align-items:center;gap:0.2rem;min-width:80px}
.seat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,0.2);box-shadow:0 2px 8px rgba(0,0,0,0.4);flex-shrink:0}
.seat-name{font-size:0.7rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.seat-chips{font-size:0.6rem;color:var(--gold);font-weight:500;display:flex;align-items:center;gap:0.2rem}
.seat-chips svg{width:10px;height:10px}
.seat-cards{display:flex;gap:3px}
.seat-bet{position:absolute;font-size:0.65rem;font-weight:600;color:var(--gold);opacity:0;transition:opacity 0.3s ease;white-space:nowrap;display:flex;align-items:center;gap:0.3rem}
.seat-bet.visible{opacity:1}
.seat-bet svg{width:14px;height:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));animation:chipBounce 0.3s ease}
.seat.acting .seat-avatar{border-color:var(--accent);box-shadow:0 0 10px rgba(56,189,248,0.5)}
.seat.acting .seat-name{color:var(--accent);text-shadow:0 0 8px rgba(56,189,248,0.5)}
.seat.folded{opacity:0.35}
.seat.winner .seat-info{animation:pulse 0.6s ease}
.seat.winner .seat-avatar{border-color:var(--gold);box-shadow:0 0 15px rgba(251,191,36,0.6)}
.seat.winner .seat-name{color:var(--gold)}
.seat-tag{font-size:0.45rem;padding:0.1rem 0.3rem;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:1px;line-height:1}
.seat-tag.dealer{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(251,191,36,0.3)}
.seat-tag.sb{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(56,189,248,0.3)}
.seat-tag.bb{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(167,139,250,0.3)}

/* Bet positions relative to each seat */
.seat.pos-0 .seat-bet{top:-30px}
.seat.pos-1 .seat-bet{top:-25px;right:-10px}
.seat.pos-2 .seat-bet{bottom:-30px;right:-10px}
.seat.pos-3 .seat-bet{bottom:-25px;left:50%;transform:translateX(-50%)}
.seat.pos-4 .seat-bet{bottom:-25px;left:0}
.seat.pos-5 .seat-bet{bottom:-25px;right:0}
.seat.pos-6 .seat-bet{bottom:-25px;left:50%;transform:translateX(-50%)}
.seat.pos-7 .seat-bet{bottom:-30px;left:-10px}
.seat.pos-8 .seat-bet{top:-25px;left:-10px}

/* ===================== ACTION PANEL ===================== */
.action-panel{position:relative;z-index:20;padding:0.75rem 1rem;background:rgba(10,14,26,0.9);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:0.5rem}
.action-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.5}
.action-slider-row{display:flex;align-items:center;gap:0.75rem;padding:0 0.25rem}
.action-slider-row label{font-size:0.7rem;color:var(--text-dim);min-width:40px}
.action-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--bg-elevated);border-radius:2px;outline:none;cursor:pointer}
.action-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#818cf8);cursor:pointer;box-shadow:0 0 8px rgba(56,189,248,0.5);border:2px solid #fff}
.action-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#818cf8);cursor:pointer;border:2px solid #fff}
.action-slider-val{font-size:0.8rem;font-weight:600;color:var(--gold);min-width:60px;text-align:right}
.action-buttons{display:flex;gap:0.5rem}
.action-btn{flex:1;padding:0.7rem;border:none;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all var(--transition);text-transform:uppercase;letter-spacing:1px}
.action-btn:disabled{opacity:0.3;cursor:not-allowed}
.action-btn.fold{background:var(--bg-elevated);color:var(--text-dim);border:1px solid var(--border)}
.action-btn.fold:hover:not(:disabled){background:var(--red-dim);color:var(--red);border-color:var(--red)}
.action-btn.check{background:var(--green-dim);color:var(--green);border:1px solid rgba(52,211,153,0.3)}
.action-btn.check:hover:not(:disabled){background:rgba(52,211,153,0.25)}
.action-btn.call{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(56,189,248,0.3)}
.action-btn.call:hover:not(:disabled){background:rgba(56,189,248,0.25)}
.action-btn.raise{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(251,191,36,0.3)}
.action-btn.raise:hover:not(:disabled){background:rgba(251,191,36,0.25)}
.action-btn.allin{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,0.3);position:relative;overflow:hidden}
.action-btn.allin:hover:not(:disabled){background:rgba(248,113,113,0.25)}
.action-btn.allin::after{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.1) 50%,transparent 70%);background-size:200% 200%;animation:shimmer 2s infinite}
.action-btn.preset{flex:none;width:48px;font-size:0.65rem;padding:0.5rem 0}
.action-preset-row{display:flex;gap:0.4rem;padding:0 0.25rem}
.action-disabled-msg{text-align:center;color:var(--text-muted);font-size:0.8rem;padding:0.5rem}

/* ===================== GAME LOG ===================== */
.game-log{position:absolute;bottom:80px;left:10px;width:240px;max-height:120px;overflow-y:auto;background:rgba(10,14,26,0.75);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:8px;padding:0.5rem;font-size:0.65rem;color:var(--text-dim);z-index:15;transition:opacity 0.3s}
.game-log::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.game-log:empty{display:none}
.log-entry{padding:0.15rem 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.log-entry:last-child{border-bottom:none}
.log-entry .hl{color:var(--accent)}

/* ===================== RESULT OVERLAY ===================== */
.result-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;animation:fadeIn 0.3s ease}
.result-overlay.active{display:flex}
.result-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem 2.5rem;text-align:center;animation:scaleIn 0.4s ease;max-width:360px;width:90vw;position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.result-card h2{font-size:1.5rem;font-weight:700;margin-bottom:0.5rem}
.result-card h2.win{color:var(--gold)}
.result-card h2.lose{color:var(--text-dim)}
.result-card .result-hand{font-size:0.8rem;color:var(--text-dim);margin-bottom:1rem}
.result-card .result-cards{display:flex;justify-content:center;gap:4px;margin-bottom:1rem}
.result-card .result-chips{font-size:1.2rem;font-weight:700;color:var(--gold);margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;gap:0.5rem}
.result-card .result-chips svg{width:20px;height:20px}
.result-btn{padding:0.7rem 2rem;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent),#818cf8);color:#fff;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all var(--transition);letter-spacing:0.5px;position:relative;overflow:hidden}
.result-btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(56,189,248,0.3)}
.result-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.15) 50%,transparent 70%);background-size:200% 200%;animation:shimmer 3s infinite}

/* ===================== GAME OVER OVERLAY ===================== */
.gameover-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;animation:fadeIn 0.3s ease}
.gameover-overlay.active{display:flex}
.gameover-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;text-align:center;animation:scaleIn 0.4s ease;max-width:400px;width:90vw;position:relative;overflow:hidden}
.gameover-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.gameover-card h2{font-size:2rem;font-weight:800;margin-bottom:0.5rem}
.gameover-card h2.win{background:linear-gradient(135deg,var(--gold),#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gameover-card h2.lose{color:var(--text-muted)}
.gameover-stats{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin:1.5rem 0}
.gameover-stat{background:var(--bg-surface);border-radius:8px;padding:0.6rem;border:1px solid var(--border)}
.gameover-stat .stat-label{font-size:0.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.gameover-stat .stat-val{font-size:1rem;font-weight:700;color:var(--text)}
.gameover-buttons{display:flex;gap:0.75rem;justify-content:center;margin-top:1rem}

/* ===================== SETTINGS PANEL ===================== */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:90}
.settings-overlay.active{display:flex}
.settings-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:min(400px,90vw);max-height:80vh;overflow-y:auto;animation:scaleIn 0.3s ease;position:relative;overflow:hidden}
.settings-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.settings-panel h2{font-size:1.2rem;font-weight:700;margin-bottom:1.25rem;color:var(--accent)}
.setting-group{margin-bottom:1.25rem}
.setting-group label{display:block;font-size:0.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.4rem}
.setting-group select,.setting-group input[type="number"]{width:100%;padding:0.5rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.85rem}
.setting-group select:focus,.setting-group input:focus{outline:none;border-color:var(--accent)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0}
.setting-row span{font-size:0.85rem}
.toggle{width:40px;height:22px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;cursor:pointer;position:relative;transition:all var(--transition)}
.toggle.active{background:var(--accent-dim);border-color:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--text);border-radius:50%;transition:all var(--transition)}
.toggle.active::after{left:20px;background:var(--accent)}
.settings-close{width:100%;padding:0.6rem;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);color:var(--text);font-size:0.85rem;cursor:pointer;margin-top:0.5rem;transition:all var(--transition)}
.settings-close:hover{border-color:var(--accent);background:var(--bg-elevated)}

/* ===================== STATS PANEL ===================== */
.stats-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:90}
.stats-overlay.active{display:flex}
.stats-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:2rem;width:min(440px,90vw);max-height:80vh;overflow-y:auto;animation:scaleIn 0.3s ease;position:relative;overflow:hidden}
.stats-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.stats-panel h2{font-size:1.2rem;font-weight:700;margin-bottom:1rem;color:var(--accent)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1.25rem}
.stat-box{background:var(--bg-surface);border-radius:8px;padding:0.6rem;text-align:center;border:1px solid var(--border)}
.stat-box .stat-val{font-size:1.1rem;font-weight:700}
.stat-box .stat-label{font-size:0.55rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.achievements-section h3{font-size:0.85rem;font-weight:600;margin-bottom:0.5rem;color:var(--gold);display:flex;align-items:center;gap:0.4rem}
.achievement{display:flex;align-items:center;gap:0.5rem;padding:0.5rem;border-radius:6px;border-bottom:1px solid rgba(255,255,255,0.03);transition:background 0.2s}
.achievement:last-child{border:none}
.achievement:hover{background:var(--bg-surface)}
.achievement .ach-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0;border:1px solid var(--border)}
.achievement.unlocked .ach-badge{border-color:var(--gold);box-shadow:0 0 8px rgba(251,191,36,0.3);animation:starFloat 3s ease infinite}
.achievement .ach-info{flex:1}
.achievement .ach-name{font-size:0.8rem;font-weight:500}
.achievement .ach-desc{font-size:0.6rem;color:var(--text-muted)}
.achievement.locked{opacity:0.3}
.achievement.locked .ach-badge{filter:grayscale(1)}
.stats-close{width:100%;padding:0.6rem;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);color:var(--text);font-size:0.85rem;cursor:pointer;margin-top:1rem;transition:all var(--transition)}
.stats-close:hover{border-color:var(--accent);background:var(--bg-elevated)}

/* ===================== PARTICLES ===================== */
.particles{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.particle{position:absolute;border-radius:2px;animation:confetti 2s ease-out forwards}

/* ===================== KEYBOARD HINTS ===================== */
.keyboard-hints{position:absolute;bottom:130px;right:10px;display:flex;flex-direction:column;gap:0.2rem;z-index:15;font-size:0.55rem;color:var(--text-muted)}
.keyboard-hints kbd{display:inline-block;padding:0.05rem 0.25rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:3px;font-family:monospace;font-size:0.55rem}

/* ===================== RESPONSIVE ===================== */
@media(max-width:768px){
  .game-log{width:180px;max-height:80px;font-size:0.6rem;bottom:100px}
  .keyboard-hints{display:none}
  :root{--card-w:48px;--card-h:67px}
  .seat-info{min-width:60px}
  .seat-name{font-size:0.6rem}
  .seat-chips{font-size:0.5rem}
  .seat-avatar{width:24px;height:24px;font-size:0.5rem}
  .top-bar .hud{gap:0.6rem;font-size:0.65rem}
  .action-btn{font-size:0.75rem;padding:0.55rem}
}
@media(max-width:480px){
  :root{--card-w:38px;--card-h:54px;--card-radius:4px}
  .top-bar{padding:0.4rem 0.6rem}
  .table-surface{width:95vw;height:55vw;border-width:5px}
  .seat.pos-2,.seat.pos-7{display:none}
  .action-panel{padding:0.5rem}
  .result-card,.gameover-card{padding:1.5rem}
  .game-log{display:none}
}
</style>
</head>

<script>
/* ===========================================================
   EVENT BUS
   =========================================================== */
class EventBus{
  constructor(){this._h={}}
  on(e,fn){(this._h[e]||(this._h[e]=[])).push(fn)}
  off(e,fn){if(!this._h[e])return;this._h[e]=this._h[e].filter(f=>f!==fn)}
  emit(e,...a){(this._h[e]||[]).forEach(fn=>fn(...a))}
}
const bus=new EventBus();

/* ===========================================================
   CARD / DECK
   =========================================================== */
const SUITS=['s','h','d','c'];
const SUIT_SYMBOL={s:'\u2660',h:'\u2665',d:'\u2666',c:'\u2663'};
const SUIT_COLOR={s:'black',h:'red',d:'red',c:'black'};
const RANKS=['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const RANK_VAL={};
RANKS.forEach((r,i)=>RANK_VAL[r]=i+2);

class Card{
  constructor(suit,rank){this.suit=suit;this.rank=rank}
  get val(){return RANK_VAL[this.rank]}
  get symbol(){return SUIT_SYMBOL[this.suit]}
  get color(){return SUIT_COLOR[this.suit]}
  get display(){return this.rank==='T'?'10':this.rank}
  toString(){return this.rank+this.symbol}
}

class Deck{
  constructor(){this.reset()}
  reset(){
    this.cards=[];
    for(const s of SUITS)for(const r of RANKS)this.cards.push(new Card(s,r));
    this.shuffle();
  }
  shuffle(){
    for(let i=this.cards.length-1;i>0;i--){
      const j=Math.random()*i+1|0;
      [this.cards[i],this.cards[j]]=[this.cards[j],this.cards[i]];
    }
  }
  deal(){return this.cards.pop()}
}

/* ===========================================================
   HAND EVALUATOR
   =========================================================== */
const HAND_NAMES=['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush','Royal Flush'];

class HandEvaluator{
  static evaluate(cards){
    let best=null;
    if(cards.length<5)return{rank:0,name:'High Card',value:0};
    for(const c of this.combinations(cards,5)){
      const r=this.eval5(c);
      if(!best||this.compare(r,best)>0)best=r;
    }
    return best;
  }
  static combinations(arr,k){
    const res=[];
    const comb=(s,cur)=>{
      if(cur.length===k){res.push([...cur]);return}
      for(let i=s;i<arr.length;i++){cur.push(arr[i]);comb(i+1,cur);cur.pop()}
    };
    comb(0,[]);return res;
  }
  static eval5(cards){
    const vals=cards.map(c=>c.val).sort((a,b)=>b-a);
    const suits=cards.map(c=>c.suit);
    const isFlush=suits.every(s=>s===suits[0]);
    const isStraight=this.checkStraight(vals);
    const counts={};
    vals.forEach(v=>counts[v]=(counts[v]||0)+1);
    const groups=Object.entries(counts).map(([v,c])=>({val:+v,count:c})).sort((a,b)=>b.count-a.count||(b.val-a.val));
    if(isFlush&&isStraight){
      if(vals[0]===14&&vals[4]===10)return{rank:9,name:'Royal Flush',value:9000000+vals[0]};
      return{rank:8,name:'Straight Flush',value:8000000+vals[0]};
    }
    if(groups[0].count===4)return{rank:7,name:'Four of a Kind',value:7000000+groups[0].val*100+groups[1].val};
    if(groups[0].count===3&&groups[1].count===2)return{rank:6,name:'Full House',value:6000000+groups[0].val*100+groups[1].val};
    if(isFlush)return{rank:5,name:'Flush',value:5000000+vals.reduce((s,v)=>s*100+v,0)};
    if(isStraight)return{rank:4,name:'Straight',value:4000000+vals[0]};
    if(groups[0].count===3)return{rank:3,name:'Three of a Kind',value:3000000+groups[0].val*10000+groups[1].val*100+groups[2].val};
    if(groups[0].count===2&&groups[1].count===2)return{rank:2,name:'Two Pair',value:2000000+groups[0].val*10000+groups[1].val*100+groups[2].val};
    if(groups[0].count===2)return{rank:1,name:'One Pair',value:1000000+groups[0].val*10000+groups[1].val*1000+groups[2].val*100+groups[3].val};
    return{rank:0,name:'High Card',value:vals.reduce((s,v)=>s*100+v,0)};
  }
  static checkStraight(vals){
    const u=[...new Set(vals)].sort((a,b)=>b-a);
    if(u.length<5)return false;
    if(u[0]-u[4]===4)return true;
    if(u[0]===14&&u[1]===5&&u[2]===4&&u[3]===3&&u[4]===2)return true;
    return false;
  }
  static compare(a,b){return a.value!==b.value?a.value-b.value:0}
}

const AVATAR_COLORS=['#38bdf8','#f87171','#34d399','#fbbf24','#a78bfa','#fb923c','#e879f9','#22d3ee','#84cc16'];
let _pid=0;
class Player{
  constructor(name,chips,isHuman=false){
    this.id=_pid++;this.name=name;this.chips=chips;this.startChips=chips;
    this.hand=[];this.folded=false;this.allin=false;this.isHuman=isHuman;
    this.currentBet=0;this.totalBet=0;this.lastAction='';
    this.avatarColor=AVATAR_COLORS[this.id%AVATAR_COLORS.length];
    this.avatarLetter=name.charAt(0);
  }
  resetForHand(){this.hand=[];this.folded=false;this.allin=false;this.currentBet=0;this.totalBet=0;this.lastAction=''}
  bet(amt){
    amt=Math.min(amt,this.chips);
    this.chips-=amt;this.currentBet+=amt;this.totalBet+=amt;
    if(this.chips===0)this.allin=true;
    return amt;
  }
  receive(card){this.hand.push(card)}
  fold(){this.folded=true;this.lastAction='fold'}
}

/* ===========================================================
   POKER AI
   =========================================================== */
class PokerAI{
  constructor(difficulty='medium'){this.difficulty=difficulty}
  decide(player,game){
    if(player.folded||player.allin||player.chips<=0)return null;
    const act=game.currentBet-player.currentBet;
    const hs=this.handStrength(player,game);
    const r=Math.random();
    switch(this.difficulty){
      case'easy':return this.easyDecide(player,act,hs,r,game);
      case'medium':return this.mediumDecide(player,act,hs,r,game);
      case'hard':return this.hardDecide(player,act,hs,r,game);
      case'expert':return this.expertDecide(player,act,hs,r,game);
      default:return this.mediumDecide(player,act,hs,r,game);
    }
  }
  handStrength(player,game){
    const all=[...player.hand,...game.communityCards];
    if(all.length<2)return 0.5;
    if(all.length<5){
      const pair=player.hand[0].rank===player.hand[1].rank;
      const high=player.hand.some(c=>c.val>=11);
      const suited=player.hand[0].suit===player.hand[1].suit;
      let s=0.4;
      if(pair)s+=0.25;if(high)s+=0.1;if(suited)s+=0.05;
      return Math.min(s,0.95);
    }
    return HandEvaluator.evaluate(all).value/9000000;
  }
  easyDecide(player,act,hs,r,game){
    if(act===0){if(hs>0.5&&r>0.6)return{action:'raise',amount:game.bigBlind*2};return{action:'check'}}
    if(hs<0.2)return{action:'fold'};
    if(hs>0.7&&r>0.7)return{action:'call'};
    if(r>0.5)return{action:'call'};
    return{action:'fold'};
  }
  mediumDecide(player,act,hs,r,game){
    if(act===0){
      if(hs>0.7&&r>0.4)return{action:'raise',amount:Math.max(game.bigBlind*2,player.chips*0.1|0)};
      if(hs>0.5&&r>0.7)return{action:'raise',amount:game.bigBlind*2};
      return{action:'check'};
    }
    const potOdds=act/(game.pot+act+0.01);
    if(hs<0.15)return{action:'fold'};
    if(hs>0.85&&r>0.3)return{action:'allin'};
    if(hs>potOdds+0.1)return{action:'call'};
    if(r>0.8&&hs>0.6)return{action:'call'};
    return{action:'fold'};
  }
  hardDecide(player,act,hs,r,game){
    if(act===0){
      if(hs>0.75)return{action:'raise',amount:game.bigBlind*(2+Math.floor(r*3))};
      if(hs>0.5&&r>0.5)return{action:'raise',amount:game.bigBlind*2};
      return{action:'check'};
    }
    if(hs<0.1)return{action:'fold'};
    if(hs>0.9&&r>0.2)return{action:'allin'};
    const potOdds=act/(game.pot+act+0.01);
    if(hs>potOdds+0.15)return{action:'call'};
    if(hs>0.5&&act<=game.bigBlind*3)return{action:'call'};
    if(hs>0.3&&r>0.8&&act<=game.bigBlind*2)return{action:'call'};
    return{action:'fold'};
  }
  expertDecide(player,act,hs,r,game){
    if(act===0){
      if(hs>0.8)return{action:'raise',amount:Math.floor(game.pot*(0.5+r*0.5))||game.bigBlind*3};
      if(hs>0.6&&r>0.3)return{action:'raise',amount:game.bigBlind*2};
      if(hs>0.4&&r>0.6)return{action:'check'};
      return{action:'check'};
    }
    if(hs<0.08)return{action:'fold'};
    if(hs>0.92)return{action:'allin'};
    const potOdds=act/(game.pot+act+0.01);
    if(hs>potOdds+0.1)return{action:'call'};
    if(hs>0.6&&act<=game.bigBlind*4)return{action:'call'};
    if(hs>0.4&&r>0.85)return{action:'call'};
    return{action:'fold'};
  }
}

/* ===========================================================
   AUDIO ENGINE
   =========================================================== */
class AudioEngine{
  constructor(){this.ctx=null;this.enabled=true;this.initialized=false}
  init(){if(!this.initialized)try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.initialized=true}catch(e){}}
  play(type){
    if(!this.enabled||!this.ctx)return;
    try{
      if(this.ctx.state==='suspended')this.ctx.resume();
      switch(type){
        case'deal':this._click(800,0.04);break;
        case'chip':this._tone(1200,0.06,'square',0.15);break;
        case'fold':this._tone(300,0.1,'sine',0.1);break;
        case'raise':this._sweep(600,1200,0.12);break;
        case'check':this._click(900,0.03);break;
        case'win':this._fanfare();break;
        case'lose':this._tone(200,0.3,'sine',0.15);break;
        case'click':this._click(1000,0.02);break;
        case'allin':this._sweep(400,1600,0.2);break;
      }
    }catch(e){}
  }
  _tone(f,d,t='sine',v=0.1){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d);
  }
  _click(f,d){this._tone(f,d,'sine',0.08)}
  _sweep(f1,f2,d){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(f1,this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2,this.ctx.currentTime+d);
    g.gain.setValueAtTime(0.12,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+d);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d);
  }
  _fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this._tone(f,0.15,'sine',0.1),i*80))}
}
const audio=new AudioEngine();

class Storage{
  constructor(){this.key='pokerNight'}
  load(){try{return JSON.parse(localStorage.getItem(this.key))||{}}catch(e){return{}}}
  save(data){try{localStorage.setItem(this.key,JSON.stringify(data))}catch(e){}}
  get(k,d){return this.load()[k]??d}
  set(k,v){const d=this.load();d[k]=v;this.save(d)}
}
const storage=new Storage();

class StatsManager{
  constructor(){this.data=storage.get('stats',{gamesPlayed:0,gamesWon:0,handsPlayed:0,handsWon:0,totalWinnings:0,bestHand:0,biggestPot:0,achievements:[]})}
  save(){storage.set('stats',this.data)}
  recordHand(won,amount){
    this.data.handsPlayed++;
    if(won){this.data.handsWon++;this.data.totalWinnings+=amount}
    if(amount>this.data.biggestPot)this.data.biggestPot=amount;
    this.save();
  }
  recordGame(won){this.data.gamesPlayed++;if(won)this.data.gamesWon++;this.save()}
  recordBestHand(rank){if(rank>this.data.bestHand)this.data.bestHand=rank;this.save()}
  unlock(id){
    if(!this.data.achievements.includes(id)){this.data.achievements.push(id);this.save();return true}
    return false;
  }
}

function spawnParticles(container,count=30){
  const colors=['#38bdf8','#fbbf24','#f87171','#34d399','#a78bfa','#fb923c'];
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.cssText=`left:${Math.random()*100}%;top:-10px;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;background:${colors[Math.random()*colors.length|0]};animation-delay:${Math.random()*0.5}s;animation-duration:${1.5+Math.random()*1.5}s`;
    container.appendChild(p);
    setTimeout(()=>p.remove(),3000);
  }
}

/* ===========================================================
   GAME MANAGER
   =========================================================== */
class GameManager{
  constructor(){
    this.settings={difficulty:'medium',numPlayers:6,startingChips:1000,animSpeed:'normal',sound:true,autoFold:false};
    this.players=[];this.humanIdx=0;this.dealerIdx=0;
    this.deck=new Deck();this.ai=new PokerAI();
    this.communityCards=[];this.pot=0;this.currentBet=0;
    this.bigBlind=20;this.smallBlind=10;this.handNum=0;
    this.stage='';this.isRunning=false;this.isProcessing=false;
    this.handWinStreak=0;this.lastHumanHandResult=null;
    this._loadSettings();
  }
  _loadSettings(){const s=storage.get('settings',null);if(s)Object.assign(this.settings,s);this._applySettings()}
  _saveSettings(){storage.set('settings',this.settings)}
  _applySettings(){
    this.ai=new PokerAI(this.settings.difficulty);
    this.bigBlind=Math.max(10,this.settings.startingChips/50|0);
    this.smallBlind=this.bigBlind/2;
  }
  setSetting(k,v){this.settings[k]=v;this._saveSettings();this._applySettings()}
  toggleSetting(k,el){
    this.settings[k]=!this.settings[k];el.classList.toggle('active',this.settings[k]);
    if(k==='sound')audio.enabled=this.settings[k];
  }
  toggleSound(){
    this.settings.sound=!this.settings.sound;audio.enabled=this.settings.sound;
    document.getElementById('sound-btn').innerHTML=this.settings.sound?'<svg><use href="#icon-sound"/></svg>':'<svg><use href="#icon-mute"/></svg>';
  }

  showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
  hideOverlay(id){document.getElementById(id).classList.remove('active')}
  showOverlay(id){document.getElementById(id).classList.add('active')}

  showMenu(){this.isRunning=false;document.getElementById('result-overlay').classList.remove('active');document.getElementById('gameover-overlay').classList.remove('active');this.showScreen('main-menu')}
  goMenu(){this.showMenu()}

  showSettings(){
    const s=this.settings;
    document.getElementById('set-difficulty').value=s.difficulty;
    document.getElementById('set-players').value=s.numPlayers;
    document.getElementById('set-chips').value=s.startingChips;
    document.getElementById('set-speed').value=s.animSpeed;
    document.getElementById('set-sound').classList.toggle('active',s.sound);
    document.getElementById('set-autofold').classList.toggle('active',s.autoFold);
    this.showOverlay('settings-overlay');
  }
  hideSettings(){
    const s=this.settings;
    s.difficulty=document.getElementById('set-difficulty').value;
    s.numPlayers=+document.getElementById('set-players').value;
    s.startingChips=+document.getElementById('set-chips').value;
    s.animSpeed=document.getElementById('set-speed').value;
    this._saveSettings();this._applySettings();this._syncMenu();
    this.hideOverlay('settings-overlay');
  }
  showStats(){
    const d=stats.data;
    document.getElementById('stats-grid').innerHTML=[
      ['Games',d.gamesPlayed],['Won',d.gamesWon],['Win Rate',d.gamesPlayed?((d.gamesWon/d.gamesPlayed)*100|0)+'%':'0%'],
      ['Hands',d.handsPlayed],['Won',d.handsWon],['Rate',d.handsPlayed?((d.handsWon/d.handsPlayed)*100|0)+'%':'0%'],
      ['Winnings',d.totalWinnings.toLocaleString()],['Best',HAND_NAMES[d.bestHand]||'N/A'],['Biggest',d.biggestPot.toLocaleString()]
    ].map(([l,v])=>`<div class="stat-box"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');
    document.getElementById('achievements-list').innerHTML=ACHIEVEMENTS.map(a=>{
      const unlocked=d.achievements.includes(a.id);
      return`<div class="achievement ${unlocked?'unlocked':'locked'}"><div class="ach-badge" style="background:${a.color}20;color:${a.color}">${a.icon}</div><div class="ach-info"><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div></div>`;
    }).join('');
    this.showOverlay('stats-overlay');
  }
  hideStats(){this.hideOverlay('stats-overlay')}
  _syncMenu(){
    document.getElementById('menu-difficulty').value=this.settings.difficulty;
    document.getElementById('menu-players').value=this.settings.numPlayers;
    document.getElementById('menu-blinds').value=this.settings.startingChips;
    document.getElementById('menu-speed').value=this.settings.animSpeed;
  }

  get animDelay(){return this.settings.animSpeed==='fast'?150:this.settings.animSpeed==='slow'?500:300}
  delay(ms){return new Promise(r=>setTimeout(r,ms||this.animDelay))}

  /* --- GAME FLOW --- */
  startGame(){
    audio.init();this._syncMenu();this._saveSettings();
    this.players=[];this.handNum=0;
    const names=['You','Ace','Blake','Case','Dana','Eli','Finn','Gael','Hugo'];
    const n=Math.min(this.settings.numPlayers,9);
    this.players.push(new Player(names[0],this.settings.startingChips,true));
    for(let i=1;i<n;i++)this.players.push(new Player(names[i],this.settings.startingChips,false));
    this.humanIdx=0;this.dealerIdx=0;
    this.isRunning=true;this.handWinStreak=0;
    this.showScreen('game-screen');
    this._buildSeats();this.startHand();
  }
  continueGame(){
    const saved=storage.get('save',null);
    if(!saved||!saved.players||saved.players.length<2){this.startGame();return}
    audio.init();
    this.players=saved.players.map(p=>new Player(p.name,p.chips,p.isHuman));
    this.dealerIdx=saved.dealerIdx||0;this.handNum=saved.handNum||0;
    this.bigBlind=saved.bigBlind||20;this.smallBlind=this.bigBlind/2;
    this.isRunning=true;this.handWinStreak=0;
    this.showScreen('game-screen');
    this._buildSeats();this.startHand();
  }
  _saveGame(){
    storage.set('save',{players:this.players.map(p=>({name:p.name,chips:p.chips,isHuman:p.isHuman})),dealerIdx:this.dealerIdx,handNum:this.handNum,bigBlind:this.bigBlind});
  }

  /* --- SEATS --- */
  _buildSeats(){
    const c=document.getElementById('seats-container');
    const t=document.getElementById('table-surface');
    const tw=t.offsetWidth,th=t.offsetHeight;
    const n=this.players.length;
    const rect=t.getBoundingClientRect();
    const areaRect=c.parentElement.getBoundingClientRect();
    const ox=rect.left-areaRect.left,oy=rect.top-areaRect.top;
    const cx=ox+tw/2,cy=oy+th/2;
    const rx=tw/2+50,ry=th/2+35;
    c.innerHTML='';
    for(let i=0;i<n;i++){
      const angle=(Math.PI*2*i/n)-Math.PI/2;
      const sx=cx+rx*Math.cos(angle),sy=cy+ry*Math.sin(angle);
      const p=this.players[i];
      const div=document.createElement('div');
      div.className='seat';div.id='seat-'+i;
      div.style.cssText=`left:${sx}px;top:${sy}px;transform:translate(-50%,-50%)`;
      div.innerHTML=`
        <div class="seat-info">
          ${p.isHuman?'':`<div class="seat-tag tag-${i}"></div>`}
          <div class="seat-avatar" style="background:${p.avatarColor}">${p.avatarLetter}</div>
          <div class="seat-name">${p.name}</div>
          <div class="seat-chips"><svg style="width:10px;height:10px"><use href="#chip-icon"/></svg>${p.chips.toLocaleString()}</div>
          <div class="seat-cards" id="cards-${i}"></div>
        </div>
        <div class="seat-bet" id="bet-${i}"></div>`;
      c.appendChild(div);
    }
  }
  _updateSeats(){
    for(let i=0;i<this.players.length;i++){
      const p=this.players[i],el=document.getElementById('seat-'+i);
      if(!el)continue;
      el.classList.toggle('folded',p.folded);
      el.classList.remove('acting','winner');
      el.querySelector('.seat-chips').innerHTML=`<svg style="width:10px;height:10px"><use href="#chip-icon"/></svg>${p.chips.toLocaleString()}`;
      this._updateCards(i);
    }
  }
  _updateCards(i){
    const p=this.players[i],c=document.getElementById('cards-'+i);
    if(!c)return;c.innerHTML='';
    p.hand.forEach((card,ci)=>{
      const show=p.isHuman||(!p.folded&&this.stage==='showdown');
      const el=document.createElement('div');
      el.className='card small deal-anim';el.style.animationDelay=ci*0.1+'s';
      if(show){
        el.innerHTML=`<div class="card-inner"><div class="card-front"><div class="card-tl"><span class="card-rank">${card.rank==='T'?'10':card.rank}</span><span class="card-suit ${card.color}">${card.symbol}</span></div><div class="card-center"><span class="card-suit ${card.color}">${card.symbol}</span></div><div class="card-br"><span class="card-rank">${card.rank==='T'?'10':card.rank}</span><span class="card-suit ${card.color}">${card.symbol}</span></div></div></div>`;
      }else{
        el.innerHTML=`<div class="card-inner face-down"><div class="card-back">${cardBackSVG()}</div><div class="card-front"></div></div>`;
      }
      c.appendChild(el);
    });
  }
  _showBet(i,amt){
    const b=document.getElementById('bet-'+i);if(!b)return;
    if(amt>0){b.innerHTML=`<svg style="width:14px;height:14px"><use href="#chip-icon"/></svg>${amt.toLocaleString()}`;b.classList.add('visible')}
    else b.classList.remove('visible');
  }
  _clearAllBets(){for(let i=0;i<this.players.length;i++)this._showBet(i,0)}
  _setActing(i){
    document.querySelectorAll('.seat').forEach(s=>s.classList.remove('acting'));
    if(i>=0){const s=document.getElementById('seat-'+i);if(s)s.classList.add('acting')}
  }

  addLog(msg){
    const log=document.getElementById('game-log'),e=document.createElement('div');
    e.className='log-entry';e.innerHTML=msg;log.appendChild(e);log.scrollTop=log.scrollHeight;
    while(log.children.length>50)log.removeChild(log.firstChild);
  }
  clearLog(){document.getElementById('game-log').innerHTML=''}

  _updateHUD(){
    document.getElementById('hud-stage').textContent=this.stage.charAt(0).toUpperCase()+this.stage.slice(1);
    document.getElementById('hud-blinds').textContent=this.smallBlind+'/'+this.bigBlind;
    document.getElementById('hud-hand').textContent='#'+(this.handNum+1);
    document.getElementById('pot-display').textContent=this.pot.toLocaleString();
  }

  addPot(amt){this.pot+=amt}

  async startHand(){
    if(!this.isRunning)return;
    if(this.players.filter(p=>p.chips>0).length<2){this.gameOver();return}
    this.handNum++;this.deck.reset();
    this.communityCards=[];this.pot=0;this.currentBet=0;
    this.stage='preflop';this.isProcessing=false;
    this.players.forEach(p=>p.resetForHand());
    if(this.players[this.dealerIdx].chips<=0)this.dealerIdx=this.nextPlayer(this.dealerIdx);
    this._buildSeats();this.clearLog();this._updateHUD();
    this.addLog(`--- Hand #${this.handNum} ---`);
    this.addLog(`Blinds: ${this.smallBlind}/${this.bigBlind}`);
    this._updateSeats();

    if(this.handNum>1&&(this.handNum-1)%5===0){
      this.bigBlind=Math.min(this.bigBlind*2,this.settings.startingChips);
      this.smallBlind=this.bigBlind/2;
      this.addLog(`<span class="hl">Blinds increased to ${this.smallBlind}/${this.bigBlind}</span>`);
    }

    const sbIdx=this.nextPlayer(this.dealerIdx),bbIdx=this.nextPlayer(sbIdx);
    this.addPot(this.players[sbIdx].bet(this.smallBlind)+this.players[bbIdx].bet(this.bigBlind));
    this._showBet(sbIdx,this.players[sbIdx].currentBet);
    this._showBet(bbIdx,this.players[bbIdx].currentBet);
    this._setPlayerTag(sbIdx,'sb');this._setPlayerTag(bbIdx,'bb');this._setPlayerTag(this.dealerIdx,'dealer');
    this._updateSeats();

    for(let r=0;r<2;r++)for(const p of this.players)if(p.chips>0)p.receive(this.deck.deal());
    this._updateSeats();audio.play('deal');await this.delay();
    this.currentBet=this.bigBlind;

    await this.bettingRound(this.nextPlayer(bbIdx),bbIdx);
    if(this.countActiveNotFolded()<=1){await this.awardPot();return}

    this.stage='flop';
    for(let i=0;i<3;i++)this.communityCards.push(this.deck.deal());
    this._renderCommunity();this._updateHUD();
    this.addLog('<span class="hl">--- Flop ---</span>');audio.play('deal');await this.delay();
    this.currentBet=0;this._clearAllBets();this.players.forEach(p=>p.currentBet=0);
    await this.bettingRound(this.nextPlayer(this.dealerIdx));
    if(this.countActiveNotFolded()<=1){await this.awardPot();return}

    this.stage='turn';this.communityCards.push(this.deck.deal());
    this._renderCommunity();this._updateHUD();
    this.addLog('<span class="hl">--- Turn ---</span>');audio.play('deal');await this.delay();
    this.currentBet=0;this._clearAllBets();this.players.forEach(p=>p.currentBet=0);
    await this.bettingRound(this.nextPlayer(this.dealerIdx));
    if(this.countActiveNotFolded()<=1){await this.awardPot();return}

    this.stage='river';this.communityCards.push(this.deck.deal());
    this._renderCommunity();this._updateHUD();
    this.addLog('<span class="hl">--- River ---</span>');audio.play('deal');await this.delay();
    this.currentBet=0;this._clearAllBets();this.players.forEach(p=>p.currentBet=0);
    await this.bettingRound(this.nextPlayer(this.dealerIdx));
    await this.showdown();
  }

  _renderCommunity(){
    const c=document.getElementById('community-cards');c.innerHTML='';
    this.communityCards.forEach((card,i)=>{
      const el=document.createElement('div');
      el.className='card deal-anim';el.style.animationDelay=i*0.1+'s';
      el.innerHTML=`<div class="card-inner"><div class="card-front"><div class="card-tl"><span class="card-rank">${card.rank==='T'?'10':card.rank}</span><span class="card-suit ${card.color}">${card.symbol}</span></div><div class="card-center"><span class="card-suit ${card.color}">${card.symbol}</span></div><div class="card-br"><span class="card-rank">${card.rank==='T'?'10':card.rank}</span><span class="card-suit ${card.color}">${card.symbol}</span></div></div></div>`;
      c.appendChild(el);
    });
  }

  _setPlayerTag(i,type){
    const el=document.getElementById('seat-'+i);if(!el)return;
    const tag=el.querySelector('.seat-tag');
    if(tag){tag.className='seat-tag '+type;tag.textContent=type.toUpperCase()}
  }

  nextPlayer(idx){let i=(idx+1)%this.players.length,s=0;while(this.players[i].folded&&s<this.players.length){i=(i+1)%this.players.length;s++}return i}
  nextActivePlayer(idx){let i=(idx+1)%this.players.length,s=0;while((this.players[i].folded||this.players[i].allin)&&s<this.players.length){i=(i+1)%this.players.length;s++}return i}
  countActiveNotFolded(){return this.players.filter(p=>!p.folded).length}
  countActiveCanAct(){return this.players.filter(p=>!p.folded&&!p.allin&&p.chips>0).length}

  async bettingRound(startIdx,endIdx){
    let idx=startIdx,checked=0,safety=0;
    const maxIter=this.players.length*4;
    while(checked<this.countActiveCanAct()&&safety<maxIter){
      safety++;
      const p=this.players[idx];
      if(p.folded||p.allin||p.chips<=0){idx=this.nextActivePlayer(idx);if(idx===startIdx)break;continue}
      if(this.countActiveCanAct()<=1)break;
      this._setActing(idx);this._updateHUD();
      const callAmt=Math.max(0,this.currentBet-p.currentBet);
      if(p.isHuman){await this._executeAction(p,await this._getHumanAction(callAmt))}
      else{
        await this.delay();
        const act=this.ai.decide(p,this);
        if(act){
          const a={...act};
          if(a.action==='call')a.amount=callAmt;
          if(a.action==='raise'){a.amount=Math.max(this.currentBet>0?this.currentBet*2:this.bigBlind,a.amount);a.amount=Math.min(a.amount,p.chips)}
          await this._executeAction(p,a);
        }
      }
      if(this.countActiveNotFolded()<=1)break;
      if(p.lastAction!=='fold'&&p.lastAction!=='check'&&p.lastAction!=='call'&&p.lastAction!=='allin')checked=0;else checked++;
      idx=this.nextActivePlayer(idx);
      if(idx===endIdx||this.countActiveCanAct()<=1)break;
    }
    this._setActing(-1);
  }

  _getHumanAction(callAmt){return new Promise(r=>{this._humanResolve=r;this._showActionPanel(callAmt)})}

  playerAction(action){
    if(!this._humanResolve)return;
    const resolve=this._humanResolve;this._humanResolve=null;this._hideActionPanel();
    const callAmt=Math.max(0,this.currentBet-this.players[this.humanIdx].currentBet);
    if(action==='fold'){resolve({action:'fold'});return}
    if(action==='check'){resolve(callAmt>0?{action:'call'}:{action:'check'});return}
    if(action==='call'){resolve({action:'call'});return}
    if(action==='allin'){resolve({action:'allin'});return}
    if(action==='raise'){resolve({action:'raise',amount:+document.getElementById('raise-slider').value});return}
  }

  _showActionPanel(callAmt){
    const btnCheck=document.getElementById('btn-check'),btnCall=document.getElementById('btn-call');
    const btnRaise=document.getElementById('btn-raise'),btnAllin=document.getElementById('btn-allin');
    const sliderRow=document.getElementById('slider-row'),presetRow=document.getElementById('preset-row');
    document.getElementById('action-msg').style.display='none';
    if(callAmt>0){btnCheck.style.display='none';btnCall.style.display='';btnCall.textContent=`Call ${callAmt}`}
    else{btnCheck.style.display='';btnCall.style.display='none'}
    const player=this.players[this.humanIdx];
    if(player.chips<=callAmt){btnRaise.style.display='none';sliderRow.style.display='none';presetRow.style.display='none'}
    else{
      btnRaise.style.display='';sliderRow.style.display='';presetRow.style.display='';
      const minR=Math.max(this.currentBet>0?this.currentBet*2:this.bigBlind,0);
      const slider=document.getElementById('raise-slider');
      slider.min=minR;slider.max=player.chips;slider.value=minR;
      btnRaise.textContent=`Raise ${minR}`;
      slider.oninput=()=>{const v=+slider.value;btnRaise.textContent=`Raise ${v.toLocaleString()}`;document.getElementById('raise-val').textContent=v.toLocaleString()};
      document.getElementById('raise-val').textContent=minR.toLocaleString();
    }
    if(player.chips<=callAmt)btnAllin.style.display='none';
    else{btnAllin.style.display='';btnAllin.textContent=`All-in (${player.chips.toLocaleString()})`}
  }

  _hideActionPanel(){document.getElementById('slider-row').style.display='none';document.getElementById('preset-row').style.display='none'}

  setPreset(mult){
    const slider=document.getElementById('raise-slider');
    slider.value=Math.min(Math.floor(this.pot*mult)||this.bigBlind,+slider.max);
    slider.dispatchEvent(new Event('input'));
  }

  async _executeAction(player,act){
    switch(act.action){
      case'fold':player.fold();audio.play('fold');this.addLog(`${player.name} <span class="hl">folds</span>`);break;
      case'check':audio.play('check');this.addLog(`${player.name} checks`);break;
      case'call':{
        const amt=Math.min(player.chips,Math.max(0,this.currentBet-player.currentBet));
        if(amt>0){const a=player.bet(amt);this.addPot(a);this._showBet(player.id,a);audio.play('chip');this.addLog(`${player.name} <span class="hl">calls ${a}</span>`)}
        else{audio.play('check');this.addLog(`${player.name} checks`)}
        break;
      }
      case'raise':{
        let amt=act.amount||this.bigBlind*2;
        amt=Math.max(amt,this.currentBet>0?this.currentBet*2:this.bigBlind);
        amt=Math.min(amt,player.chips);
        const a=player.bet(amt);this.addPot(a);this.currentBet=player.currentBet;
        this._showBet(player.id,a);audio.play('raise');
        this.addLog(`${player.name} <span class="hl">raises to ${player.currentBet}</span>`);break;
      }
      case'allin':{
        const a=player.bet(player.chips);this.addPot(a);
        if(player.currentBet>this.currentBet)this.currentBet=player.currentBet;
        this._showBet(player.id,a);audio.play('allin');
        this.addLog(`<span class="hl">${player.name} goes ALL-IN for ${a}!</span>`);break;
      }
    }
    player.lastAction=act.action;this._updateSeats();this._updateHUD();
  }

  async showdown(){
    this.stage='showdown';this._updateHUD();
    this.addLog('<span class="hl">=== SHOWDOWN ===</span>');
    for(let i=0;i<this.players.length;i++)if(!this.players[i].folded&&this.players[i].hand.length>0)this._showAllCards(i);
    audio.play('deal');await this.delay(600);
    const contenders=this.players.filter(p=>!p.folded&&p.hand.length>0);
    const results=contenders.map(p=>{
      const all=[...p.hand,...this.communityCards],ev=HandEvaluator.evaluate(all);
      stats.recordBestHand(ev.rank);return{player:p,handEval:ev,hand:all};
    }).sort((a,b)=>HandEvaluator.compare(b.handEval,a.handEval));
    const winners=[results[0]];
    for(let i=1;i<results.length;i++){if(HandEvaluator.compare(results[i].handEval,results[0].handEval)===0)winners.push(results[i]);else break}
    const share=Math.floor(this.pot/winners.length),remainder=this.pot-share*winners.length;
    winners.forEach((w,i)=>{const amt=share+(i===0?remainder:0);w.player.chips+=amt;this.addLog(`<span class="hl">${w.player.name} wins ${amt.toLocaleString()} with ${w.handEval.name}</span>`)});
    let humanWon=false,humanAmount=0;
    const humanResult=results.find(r=>r.player.isHuman);
    if(humanResult){
      if(winners.some(w=>w.player.isHuman)){
        humanWon=true;humanAmount=share+(winners[0].player.isHuman?remainder:0);
        this.handWinStreak++;audio.play('win');stats.recordHand(true,humanAmount);
        spawnParticles(document.getElementById('particles'),40);
        if(humanResult.handEval.rank>=9)stats.unlock('royal_flush');
        if(humanAmount>10000)stats.unlock('high_roller');
        if(this.handWinStreak>=3)stats.unlock('streak_3');
        if(this.handWinStreak>=5)stats.unlock('streak_5');
        if(humanResult.player.allin)stats.unlock('allin_win');
      }else{this.handWinStreak=0;audio.play('lose');stats.recordHand(false,0)}
    }
    winners.forEach(w=>{const el=document.getElementById('seat-'+this.players.indexOf(w.player));if(el)el.classList.add('winner')});
    this._updateSeats();await this.delay(800);
    const title=document.getElementById('result-title'),hand=document.getElementById('result-hand');
    const cards=document.getElementById('result-cards'),chips=document.getElementById('result-chips');
    if(humanWon){title.textContent='You Win!';title.className='win';chips.innerHTML=`<svg style="width:20px;height:20px"><use href="#chip-icon"/></svg>+${humanAmount.toLocaleString()}`}
    else{title.textContent='You Lose';title.className='lose';chips.textContent=''}
    if(humanResult){
      hand.textContent=humanResult.handEval.name;
      cards.innerHTML=humanResult.player.hand.map(c=>`<div class="card small"><div class="card-inner"><div class="card-front"><div class="card-tl"><span class="card-rank">${c.rank==='T'?'10':c.rank}</span><span class="card-suit ${c.color}">${c.symbol}</span></div><div class="card-center"><span class="card-suit ${c.color}">${c.symbol}</span></div><div class="card-br"><span class="card-rank">${c.rank==='T'?'10':c.rank}</span><span class="card-suit ${c.color}">${c.symbol}</span></div></div></div></div>`).join('');
    }
    this.showOverlay('result-overlay');this._saveGame();
  }

  _showAllCards(i){
    const c=document.getElementById('cards-'+i),p=this.players[i];
    if(!c||p.hand.length===0)return;c.innerHTML='';
    p.hand.forEach((card,ci)=>{
      const el=document.createElement('div');
      el.className='card small deal-anim';el.style.animationDelay=ci*0.1+'s';
      el.innerHTML=`<div class="card-inner"><div class="card-front"><div class="card-tl"><span class="card-rank">${card.rank==='T'?'10':card.rank}</span><span class="card-suit ${card.color}">${card.symbol}</span></div><div class="card-center"><span class="card-suit ${card.color}">${card.symbol}</span></div><div class="card-br"><span class="card-rank">${card.rank==='T'?'10':card.rank}</span><span class="card-suit ${card.color}">${card.symbol}</span></div></div></div>`;
      c.appendChild(el);
    });
  }

  async awardPot(){
    const remaining=this.players.filter(p=>!p.folded);
    if(remaining.length===1){
      const w=remaining[0];w.chips+=this.pot;
      this.addLog(`<span class="hl">${w.name} wins ${this.pot.toLocaleString()} (everyone folded)</span>`);
      if(w.isHuman){audio.play('win');stats.recordHand(true,this.pot);this.handWinStreak++;spawnParticles(document.getElementById('particles'),30)}
      else if(this.players[this.humanIdx].folded){audio.play('lose');stats.recordHand(false,0);this.handWinStreak=0}
    }
    this._updateSeats();this._updateHUD();await this.delay(500);
    this.showOverlay('result-overlay');
    const title=document.getElementById('result-title'),hand=document.getElementById('result-hand');
    const cards=document.getElementById('result-cards'),chips=document.getElementById('result-chips');
    if(remaining.length===1&&remaining[0].isHuman){title.textContent='You Win!';title.className='win';hand.textContent='Everyone Folded'}
    else if(remaining.length===1){title.textContent='You Lose';title.className='lose';hand.textContent=`${remaining[0].name} wins`}
    cards.innerHTML='';chips.textContent='';this._saveGame();
  }

  nextHand(){
    this.hideOverlay('result-overlay');
    if(this.players.filter(p=>p.chips>0).length<2||this.players[this.humanIdx].chips<=0){this.gameOver();return}
    this.dealerIdx=this.nextPlayer(this.dealerIdx);this.startHand();
  }

  gameOver(){
    const human=this.players[this.humanIdx];
    const won=human.chips>0&&this.players.filter(p=>p.chips>0).length<=1;
    if(won)stats.unlock('first_win');stats.recordGame(won);
    if(stats.data.handsPlayed>=100)stats.unlock('hands_100');
    if(stats.data.gamesPlayed>=10)stats.unlock('games_10');
    if(human.chips>=50000)stats.unlock('millionaire');
    const title=document.getElementById('gameover-title'),sub=document.getElementById('gameover-sub'),sg=document.getElementById('gameover-stats');
    title.textContent=won?'You Win!':'Game Over';title.className=won?'win':'lose';
    sub.textContent=won?'Congratulations, you took all the chips!':'Better luck next time!';
    sg.innerHTML=[['Hands Played',this.handNum],['Final Chips',human.chips.toLocaleString()],['Hands Won',stats.data.handsWon],['Win Rate',stats.data.handsPlayed?((stats.data.handsWon/stats.data.handsPlayed)*100|0)+'%':'0%']].map(([l,v])=>`<div class="gameover-stat"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');
    this.showOverlay('gameover-overlay');
  }
}

/* --- KEYBOARD --- */
document.addEventListener('keydown',e=>{
  if(!GM.isRunning||GM.isProcessing||!GM._humanResolve)return;
  switch(e.key.toLowerCase()){case'f':GM.playerAction('fold');break;case'c':GM.playerAction('check');break;case'r':GM.playerAction('raise');break;case'a':GM.playerAction('allin');break}
});

/* --- INIT --- */
const GM=new GameManager();
spawnFloatingSuits();
(async function(){
  const bar=document.getElementById('load-bar');
  for(let i=0;i<=100;i+=5){bar.style.width=i+'%';await new Promise(r=>setTimeout(r,40))}
  await new Promise(r=>setTimeout(r,300));GM.showScreen('main-menu');
})();
</script>
